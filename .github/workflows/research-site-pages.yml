name: Research site Pages

on:
  push:
    branches: [main]
    paths:
      - "research_site/**"
      - ".github/workflows/research-site-pages.yml"
      - "README.md"
      - "docs/**"
      - "Lending_project_v2 (1).ipynb"
      - "lending_artifacts/metadata.json"
      - "flask_app/**"
      - "scripts/**"
      - "deploy/**"
  pull_request:
    paths:
      - "research_site/**"
      - ".github/workflows/research-site-pages.yml"
      - "docs/**"
      - "Lending_project_v2 (1).ipynb"
      - "lending_artifacts/metadata.json"
      - "flask_app/**"
      - "scripts/**"
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-pages-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: research_site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: research_site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: research_site/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy research publication
        id: deployment
        uses: actions/deploy-pages@v4
