# Loopback-only demo. Reach it through SSH forwarding, not an open firewall.
server {
    listen 127.0.0.1:8080;
    server_name _;
    root /opt/eab-credit/current/frontend-dist;
    index index.html;
    client_max_body_size 16k;
    access_log /var/log/nginx/eab-credit.access.log;
    error_log /var/log/nginx/eab-credit.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
}
